[package]
name = "bamboo-core"
version = "0.3.22"
edition = "2024"


description = "Vietnamese input method engine written in Rust"
license = "MIT"
repository = "https://github.com/nguyen10t2/bamboo_core"
documentation = "https://docs.rs/bamboo-core"
readme = "README.md"

keywords = ["vietnamese", "ime", "input-method", "telex", "unicode"]
categories = ["text-processing"]

include = [
    "src/**",
    "tests/**",
    "benches/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md"
]


[dependencies]
bitflags = "2.11.1"
phf = { version = "0.13.1", features = ["macros"] }
rayon = { version = "1.10", optional = true }
rustc-hash = "2"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
parallel = ["rayon"]
wasm = ["wasm-bindgen"]


[[bench]]
name = "engine_bench"
harness = false

[[bench]]
name = "telex_benchmark"
harness = false

[[bench]]
name = "memory_profile"
harness = false

[[bench]]
name = "dfa_misspell_test"
harness = false

[[bench]]
name = "vi_bench"
harness = false

[dev-dependencies]
skey-engine = "0.1.4"
uvie = "2.1.1"
vi = "0.8.0"

[profile.release]


opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1


